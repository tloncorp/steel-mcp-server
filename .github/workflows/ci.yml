name: CI

# Three independent jobs rather than one chain. The browser and E2E suites drive real browsers and
# are the slowest and least stable part of the run; behind a single job their failure also withheld
# the byte budget, conformance, the MCPB bundle and the container smoke, so a browser fault read as
# "packaging is unverified" when packaging had simply never run.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Checks and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: tools/list byte budget
        run: npm run budget
      - name: MCP conformance
        run: ./scripts/run-conformance.sh
      - name: MCPB bundle
        run: npm run pack:mcpb
      # Nothing else builds this Dockerfile — the E2E stack runs upstream images — so without this the
      # image is first built during a release. Running both entrypoints is the point rather than the
      # build: three separate faults got through a green build here, each of them silent. The image
      # reinstalled devDependencies and grew 280MB; a fix for that left the hosted server unable to
      # resolve ioredis; and the documented way to select the hosted entrypoint ran the stdio one.
      - name: Container image serves both entrypoints
        run: ./scripts/smoke-container.sh steel-mcp:ci

  browser:
    name: MCP Apps in a real browser
    runs-on: ubuntu-latest
    env:
      # The launch harness keeps this bounded and prints it only when startup fails.
      CHROME_DEBUG_LOGGING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser-test prerequisites
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Chrome path: $chrome_path"
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          command -v openssl
          # Ubuntu 24.04 forbids unprivileged user namespaces, which Chrome's sandbox needs to start.
          # Without this the browser dies before it writes its debugging port. Relaxing the runner
          # keeps the sandbox on, which is what the suite runs with on a developer machine.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Session viewer in a real browser
        run: npm run test:browser

  e2e:
    name: Real-browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The leak test spawns dist/stdio.js, so this job builds even though the checks job also does.
      - name: Build
        run: npm run build
      - name: Real-browser E2E tests
        run: npm run test:e2e
