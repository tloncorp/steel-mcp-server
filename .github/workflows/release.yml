name: Release candidate

# This workflow builds the candidate once, then pauses at a protected environment. The publish job
# promotes those exact bytes; it does not install dependencies, rebuild, or repack the MCPB.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steel-mcp-release
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require a main-branch dispatch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "Release candidates must be dispatched from main, not $GITHUB_REF." >&2
            exit 1
          fi

  build-candidate:
    needs: validate-source
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      version: ${{ steps.identity.outputs.version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Record candidate identity
        id: identity
        run: |
          version="$(node -p 'require("./package.json").version')"
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "artifact_name=steel-mcp-$version-$short_sha-candidate" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run sync:version -- --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Browser-test prerequisites
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          command -v openssl
          # Ubuntu 24.04 forbids unprivileged user namespaces, which Chrome's sandbox needs to start.
          # Without this the browser dies before it writes its debugging port. Relaxing the runner
          # keeps the sandbox on, which is what the suite runs with on a developer machine.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run test:browser
      - run: npm run test:e2e
      - run: npm run budget
      - run: ./scripts/run-conformance.sh
      - run: npm run pack:mcpb
      - run: ./scripts/smoke-container.sh steel-mcp:candidate

      - name: Checksum the inspected MCPB
        run: |
          cd build
          sha256sum steel-mcp-${{ steps.identity.outputs.version }}.mcpb > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            build/steel-mcp-${{ steps.identity.outputs.version }}.mcpb
            build/SHA256SUMS

  publish-candidate:
    needs: build-candidate
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build-candidate.outputs.source_sha }}
          fetch-depth: 0
      - name: Download exact candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.build-candidate.outputs.artifact_name }}
          path: build

      - name: Verify candidate identity and checksum
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.build-candidate.outputs.source_sha }}"
          test "$(node -p 'require("./package.json").version')" = "${{ needs.build-candidate.outputs.version }}"
          cd build
          sha256sum -c SHA256SUMS

      - name: Confirm the release tag is still absent
        run: |
          tag="v${{ needs.build-candidate.outputs.version }}"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1
          remote_rc=$?
          set -e
          case "$remote_rc" in
            0) echo "Release tag $tag already exists; tags are immutable." >&2; exit 1 ;;
            2) echo "Release tag $tag is absent." ;;
            *) echo "Could not verify remote tag absence (git exit $remote_rc)." >&2; exit "$remote_rc" ;;
          esac

      - name: Tag and publish the exact GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.build-candidate.outputs.version }}"
          tag="v$version"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" "${{ needs.build-candidate.outputs.source_sha }}" -m "Release $tag"
          git push origin "$tag"

          prerelease_flags=()
          case "$version" in
            *-*) prerelease_flags=(--prerelease --latest=false) ;;
          esac
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "${prerelease_flags[@]}" \
            "build/steel-mcp-$version.mcpb" \
            build/SHA256SUMS
